<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Дурак в Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1b5e20;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      padding: 12px;
    }
    .hud { font-size: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
    .status-msg { text-align: center; font-weight: bold; background: rgba(0,0,0,0.35); padding: 8px; border-radius: 8px; margin: 6px 0; font-size: 14px; min-height: 36px; display: flex; align-items: center; justify-content: center; }
    
    .table-zone {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 6px 0;
      border: 2px dashed rgba(255,255,255,0.25);
      border-radius: 12px;
      overflow-x: auto;
      padding: 10px;
    }

    .card-pair {
      position: relative;
      width: 60px;
      height: 94px;
      flex-shrink: 0;
    }

    .card-pair .attack-card {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
    }

    .card-pair .defend-card {
      position: absolute;
      left: 10px;
      top: 12px;
      z-index: 2;
      transform: rotate(5deg);
      box-shadow: -2px 3px 10px rgba(0,0,0,0.5);
    }

    .card {
      width: 58px;
      height: 86px;
      background: #fff;
      border-radius: 8px;
      color: #111;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.35);
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s ease;
    }
    .card.red { color: #d32f2f; }
    .card.trump {
      border: 2px solid #ff1744 !important;
      box-shadow: 0 0 10px rgba(255, 23, 68, 0.7);
    }
    .card-center { text-align: center; font-size: 22px; line-height: 22px; margin: auto 0; }
    .card-corner { font-size: 13px; line-height: 13px; }

    .hand {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 2px 10px 2px;
      min-height: 98px;
    }
    .controls { display: flex; gap: 8px; margin-top: 4px; }
    button {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      font-size: 16px;
      background: #fbc02d;
      color: #000;
      cursor: pointer;
    }
    button:disabled { opacity: 0.35; cursor: default; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99;
      padding: 20px;
    }
    .modal-box {
      background: #1e3a24;
      border: 2px solid #fbc02d;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    .modal-title { font-size: 20px; margin-bottom: 20px; font-weight: bold; }
    .modal-btn {
      width: 100%;
      margin-bottom: 12px;
      padding: 14px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Меню выбора режима -->
  <div class="modal-overlay" id="start-modal">
    <div class="modal-box">
      <div class="modal-title">Выберите режим игры</div>
      <button class="modal-btn" onclick="startGame('podkidnoy')">🃏 Подкидной дурак</button>
      <button class="modal-btn" onclick="startGame('perevodnoy')">🔄 Переводной дурак</button>
    </div>
  </div>

  <div class="hud">
    <div>Бот: <span id="bot-count">6</span> карт</div>
    <div>Колода: <span id="deck-count">24</span> | Козырь: <span id="trump-val"></span></div>
  </div>

  <div class="status-msg" id="status">Выберите карту для хода</div>

  <div class="table-zone" id="table"></div>

  <div>
    <div class="hand" id="player-hand"></div>
    <div class="controls">
      <button id="action-btn" onclick="handleAction()">Бито</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const SUITS = ['♠', '♥', '♦', '♣'];
    const RANKS = ['6', '7', '8', '9', '10', 'В', 'Д', 'К', 'Т'];
    const VALUES = { '6':6, '7':7, '8':8, '9':9, '10':10, 'В':11, 'Д':12, 'К':13, 'Т':14 };

    let gameMode = 'podkidnoy';
    let deck = [], playerHand = [], botHand = [];
    let trumpSuit = '', trumpCard = null;
    let table = [];
    let isPlayerTurn = true;
    let isBotThinking = false;

    function startGame(mode) {
      gameMode = mode;
      document.getElementById('start-modal').style.display = 'none';
      initGame();
    }

    function initGame() {
      deck = [];
      for (let s of SUITS) {
        for (let r of RANKS) {
          deck.push({ suit: s, rank: r, isRed: s === '♥' || s === '♦' });
        }
      }
      deck.sort(() => Math.random() - 0.5);

      trumpCard = deck[deck.length - 1];
      trumpSuit = trumpCard.suit;

      playerHand = deck.splice(0, 6);
      botHand = deck.splice(0, 6);

      sortHand(playerHand);
      render();
    }
