<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Дурак в Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1b5e20;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      padding: 10px;
    }
    .hud {
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.25);
      padding: 6px 12px;
      border-radius: 8px;
    }
    .trump-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .status-msg { 
      text-align: center; 
      font-weight: bold; 
      background: rgba(0,0,0,0.4); 
      padding: 8px; 
      border-radius: 8px; 
      margin: 4px 0; 
      font-size: 13px; 
      min-height: 38px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    
    .table-zone {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 4px 0;
      border: 2px dashed rgba(255,255,255,0.2);
      border-radius: 12px;
      overflow-y: auto;
      padding: 8px;
    }

    .card-pair {
      position: relative;
      width: 58px;
      height: 86px;
      flex-shrink: 0;
      margin: 4px;
      border-radius: 6px;
    }

    .card-pair .attack-card {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
    }

    .card-pair .defend-card {
      position: absolute;
      left: 10px;
      top: 12px;
      z-index: 2;
      transform: rotate(6deg);
      box-shadow: -2px 3px 10px rgba(0,0,0,0.5);
    }

    .hand-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 4px;
    }

    .hand {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      max-height: 180px;
      overflow-y: auto;
      padding: 4px 0;
    }

    .card {
      width: 48px;
      height: 72px;
      background: #fff;
      border-radius: 6px;
      color: #111;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3px 4px;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.35);
      cursor: grab;
      border: 2px solid transparent;
      transition: transform 0.1s ease;
      touch-action: none;
    }
    .card:active {
      cursor: grabbing;
    }
    .card.red { color: #d32f2f; }
    .card.trump {
      border: 2px solid #ff1744 !important;
      box-shadow: 0 0 8px rgba(255, 23, 68, 0.9);
    }
    .card-center { text-align: center; font-size: 18px; line-height: 18px; margin: auto 0; pointer-events: none; }
    .card-corner { font-size: 11px; line-height: 11px; pointer-events: none; }

    .controls { display: flex; gap: 8px; margin-top: 4px; }
    button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      font-size: 15px;
      background: #fbc02d;
      color: #000;
      cursor: pointer;
    }
    button:disabled { opacity: 0.35; cursor: default; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99;
      padding: 20px;
    }
    .modal-box {
      background: #1e3a24;
      border: 2px solid #fbc02d;
      border-radius: 14px;
      padding: 22px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    .modal-title { font-size: 18px; margin-bottom: 16px; font-weight: bold; }
    .modal-btn {
      width: 100%;
      margin-bottom: 10px;
      padding: 13px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <!-- Выбор режима -->
  <div class="modal-overlay" id="start-modal">
    <div class="modal-box">
      <div class="modal-title">Выберите режим игры</div>
      <button class="modal-btn" onclick="startGame('podkidnoy')">🃏 Подкидной дурак</button>
      <button class="modal-btn" onclick="startGame('perevodnoy')">🔄 Переводной дурак</button>
    </div>
  </div>

  <!-- Диалог: Перевести или Отбиться -->
  <div class="modal-overlay" id="choice-modal" style="display: none;">
    <div class="modal-box">
      <div class="modal-title" id="choice-card-text">Как сыграть картой?</div>
      <button class="modal-btn" style="background: #29b6f6; color: #fff;" onclick="resolvePlayerChoice('transfer')">🔄 Перевести ход боту</button>
      <button class="modal-btn" style="background: #66bb6a; color: #fff;" onclick="resolvePlayerChoice('defend')">⚔️ Отбиться этой картой</button>
      <button class="modal-btn" style="background: #757575; color: #fff;" onclick="closeChoiceModal()">Отмена</button>
    </div>
  </div>

  <div class="hud">
    <div>Бот: <span id="bot-count">6</span> карт</div>
    <div class="trump-badge">Козырь: <span id="trump-val"></span></div>
    <div>Колода: <span id="deck-count">24</span></div>
  </div>

  <div class="status-msg" id="status">Раздача карт...</div>

  <div class="table-zone" id="table"></div>

  <div class="hand-container">
    <div class="hand" id="player-hand"></div>
    <div class="controls">
      <button id="action-btn" onclick="handleAction()">Бито</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const SUITS = ['♠', '♥', '♦', '♣'];
    const RANKS = ['6', '7', '8', '9', '10', 'В', 'Д', 'К', 'Т'];
    const VALUES = { '6':6, '7':7, '8':8, '9':9, '10':10, 'В':11, 'Д':12, 'К':13, 'Т':14 };

    let gameMode = 'podkidnoy';
    let deck = [], playerHand = [], botHand = [];
    let trumpSuit = '', trumpCard = null;
    let table = [];
    let isPlayerAttacking = true; 
    let isPlayerTurn = true;      
    let isBotThinking = false;
    let pendingAction = null;

    function startGame(mode) {
      gameMode = mode;
      document.getElementById('start-modal').style.display = 'none';
      initGame();
    }

    function initGame() {
      deck = [];
      for (let s of SUITS) {
        for (let r of RANKS) {
          deck.push({ suit: s, rank: r, isRed: s === '♥' || s === '♦' });
        }
      }
      deck.sort(() => Math.random() - 0.5);

      trumpCard = deck[0];
      trumpSuit = trumpCard.suit;

      playerHand = deck.splice(deck.length - 6, 6);
      botHand = deck.splice(deck.length - 6, 6);

      sortHand(playerHand);
      determineFirstTurn();
      render();
    }

    function determineFirstTurn() {
      const playerTrumps = playerHand.filter(c => c.suit === trumpSuit).sort((a,b) => VALUES[a.rank] - VALUES[b.rank]);
      const botTrumps = botHand.filter(c => c.suit === trumpSuit).sort((a,b) => VALUES[a.rank] - VALUES[b.rank]);

      if (playerTrumps.length > 0 && botTrumps.length > 0) {
        isPlayerAttacking = VALUES[playerTrumps[0].rank] < VALUES[botTrumps[0].rank];
      } else if (playerTrumps.length > 0) {
        isPlayerAttacking = true;
      } else if (botTrumps.length > 0) {
        isPlayerAttacking = false;
      } else {
        const pMin = Math.min(...playerHand.map(c => VALUES[c.rank]));
        const bMin = Math.min(...botHand.map(c => VALUES[c.rank]));
        isPlayerAttacking = pMin <= bMin;
      }

      isPlayerTurn = isPlayerAttacking;
      if (isPlayerAttacking) {
        document.getElementById('status').innerText = "Первый ход твой! Перетяни карту или нажми на неё.";
      } else {
        document.getElementById('status').innerText = "Первый ход бота. Защищайся!";
        setTimeout(botAttack, 1000);
      }
    }

    function sortHand(hand) {
      hand.sort((a, b) => {
        const isATrump = a.suit === trumpSuit;
        const isBTrump = b.suit === trumpSuit;
        if (isATrump && !isBTrump) return 1;
        if (!isATrump && isBTrump) return -1;
        return VALUES[a.rank] - VALUES[b.rank];
      });
    }

    function renderCard(c, extraClass = '') {
      const isTrump = c.suit === trumpSuit;
      return `
        <div class="card ${c.isRed ? 'red' : ''} ${isTrump ? 'trump' : ''} ${extraClass}">
          <div class="card-corner">${c.rank}</div>
          <div class="card-center">${c.suit}</div>
          <div class="card-corner" style="text-align: right;">${c.rank}</div>
        </div>
      `;
    }

    function render() {
      document.getElementById('deck-count').innerText = deck.length;
      document.getElementById('bot-count').innerText = botHand.length;
      document.getElementById('trump-val').innerText = `${trumpCard.rank}${trumpCard.suit}`;

      const handDiv = document.getElementById('player-hand');
      handDiv.innerHTML = playerHand.map((c, i) => 
        `<div class="card-wrapper" data-index="${i}">${renderCard(c)}</div>`
      ).join('');

      document.querySelectorAll('.card-wrapper').forEach(wrap => {
        setupDrag(wrap, parseInt(wrap.dataset.index));
      });

      const tableDiv = document.getElementById('table');
      tableDiv.innerHTML = table.map((p, i) => `
        <div class="card-pair" data-table-idx="${i}">
          ${renderCard(p.attack, 'attack-card')}
          ${p.defend ? renderCard(p.defend, 'defend-card') : ''}
        </div>
      `).join('');

      const btn = document.getElementById('action-btn');
      const hasUncovered = table.some(p => !p.defend);

      if (isPlayerAttacking) {
        btn.innerText = "Бито";
        btn.disabled = table.length === 0 || hasUncovered || isBotThinking;
      } else {
        if (table.length > 0 && !hasUncovered) {
          btn.innerText = "Бито";
          btn.disabled = isBotThinking;
        } else {
          btn.innerText = "Беру карту";
          btn.disabled = isBotThinking || table.length === 0;
        }
      }
    }

    function canBeat(attack, defend) {
      if (defend.suit === attack.suit) return VALUES[defend.rank] > VALUES[attack.rank];
      return defend.suit === trumpSuit && attack.suit !== trumpSuit;
    }

    function canTossCard(card) {
      if (table.length === 0) return true;
      return table.some(p => p.attack.rank === card.rank || (p.defend && p.defend.rank === card.rank));
    }

    /* DRAG-AND-DROP */
    function setupDrag(element, handIdx) {
      element.onpointerdown = (e) => {
        if (isBotThinking) return;
        const cardElem = element.querySelector('.card');
        if (!cardElem) return;

        const startX = e.clientX;
        const startY = e.clientY;
        let isDragging = false;

        const clone = cardElem.cloneNode(true);
        clone.style.position = 'fixed';
        clone.style.zIndex = '9999';
        clone.style.pointerEvents = 'none';
        clone.style.transform = 'scale(1.08) rotate(4deg)';
        clone.style.boxShadow = '0 10px 20px rgba(0,0,0,0.5)';
        clone.style.display = 'none';
        document.body.appendChild(clone);

        const moveHandler = (ev) => {
          const dx = ev.clientX - startX;
          const dy = ev.clientY - startY;

          if (!isDragging && Math.hypot(dx, dy) > 8) {
            isDragging = true;
            clone.style.display = 'flex';
            cardElem.style.opacity = '0.3';
          }

          if (isDragging) {
            clone.style.left = `${ev.clientX - 24}px`;
            clone.style.top = `${ev.clientY - 36}px`;
          }
        };

        const upHandler = (ev) => {
          window.removeEventListener('pointermove', moveHandler);
          window.removeEventListener('pointerup', upHandler);
          clone.remove();
          cardElem.style.opacity = '1';

          if (isDragging) {
            handleDrop(handIdx, ev.clientX, ev.clientY);
          } else {
            handleCardClick(handIdx);
          }
        };

        window.addEventListener('pointermove', moveHandler);
        window.addEventListener('pointerup', upHandler);
      };
    }

    function handleDrop(handIdx, x, y) {
      const tableElem = document.getElementById('table');
      const tableRect = tableElem.getBoundingClientRect();

      if (x < tableRect.left || x > tableRect.right || y < tableRect.top || y > tableRect.bottom) {
        return;
      }

      const pairs = document.querySelectorAll('.card-pair');
      let targetTableIdx = -1;

      pairs.forEach(p => {
        const r = p.getBoundingClientRect();
        if (x >= r.left - 15 && x <= r.right + 15 && y >= r.top - 15 && y <= r.bottom + 15) {
          targetTableIdx = parseInt(p.dataset.tableIdx);
        }
      });

      processPlay(handIdx, targetTableIdx);
    }

    function handleCardClick(handIdx) {
      processPlay(handIdx, -1);
    }

    /* ПОИСК КАРТЫ ДЛЯ ОТБИТИЯ С ПРИОРИТЕТОМ СТАРШЕЙ / КОЗЫРЯ */
    function findBestDefendTarget(card) {
      const eligibleTargets = [];

      for (let i = 0; i < table.length; i++) {
        if (!table[i].defend && canBeat(table[i].attack, card)) {
          eligibleTargets.push({ idx: i, attack: table[i].attack });
        }
      }

      if (eligibleTargets.length === 0) return -1;

      const isCardTrump = card.suit === trumpSuit;

      eligibleTargets.sort((a, b) => {
        const aIsTrump = a.attack.suit === trumpSuit;
        const bIsTrump = b.attack.suit === trumpSuit;

        // Если защищаемся козырем
        if (isCardTrump) {
          // 1. Если бьем козырь оппонента — бьем старший
          if (aIsTrump && bIsTrump) return VALUES[b.attack.rank] - VALUES[a.attack.rank];
          // 2. Бьем в первую очередь опасные козырные карты оппонента
          if (aIsTrump && !bIsTrump) return -1;
          if (!aIsTrump && bIsTrump) return 1;
          // 3. Среди обычных некозырных карт козырь бьет САМУЮ СТАРШУЮ карту на столе!
          return VALUES[b.attack.rank] - VALUES[a.attack.rank];
        } else {
          // Если защищаемся обычной картой по масти — бьем старшую доступную карту этой масти
          return VALUES[b.attack.rank] - VALUES[a.attack.rank];
        }
      });

      return eligibleTargets[0].idx;
    }

    function processPlay(handIdx, explicitTableIdx) {
      const card = playerHand[handIdx];

      if (isPlayerAttacking) {
        if (canTossCard(card)) {
          const unbeatCount = table.filter(p => !p.defend).length;
          if (table.length >= 6 || unbeatCount >= botHand.length) {
            document.getElementById('status').innerText = "У бота больше нет карт для защиты!";
            return;
          }

          playerHand.splice(handIdx, 1);
          table.push({ attack: card, defend: null });
          render();
          triggerBotDefense();
        }
      } else {
        const allUncovered = table.length > 0 && table.every(p => !p.defend);
        const matchRank = allUncovered && table[0].attack.rank === card.rank;
        const canTransfer = (gameMode === 'perevodnoy' && matchRank && botHand.length >= table.length + 1 && table.length < 6);

        let defendIdx = -1;
        if (explicitTableIdx !== -1 && !table[explicitTableIdx].defend && canBeat(table[explicitTableIdx].attack, card)) {
          defendIdx = explicitTableIdx;
        } else {
          defendIdx = findBestDefendTarget(card);
        }

        const canDefend = defendIdx !== -1;

        if (canTransfer && canDefend) {
          pendingAction = { handIdx, defendIdx };
          document.getElementById('choice-card-text').innerText = `Карта ${card.rank}${card.suit}: перевести или отбиться?`;
          document.getElementById('choice-modal').style.display = 'flex';
          return;
        }

        if (canTransfer && explicitTableIdx === -1) {
          executeTransfer(handIdx);
          return;
        }

        if (canDefend) {
          executeDefense(handIdx, defendIdx);
        } else {
          document.getElementById('status').innerText = "Этой картой нельзя отбиться!";
        }
      }
    }

    function resolvePlayerChoice(choice) {
      if (!pendingAction) return;
      const { handIdx, defendIdx } = pendingAction;
      closeChoiceModal();

      if (choice === 'transfer') {
        executeTransfer(handIdx);
      } else {
        executeDefense(handIdx, defendIdx);
      }
    }

    function closeChoiceModal() {
      document.getElementById('choice-modal').style.display = 'none';
      pendingAction = null;
    }

    function executeTransfer(handIdx) {
      const card = playerHand.splice(handIdx, 1)[0];
      table.push({ attack: card, defend: null });
      isPlayerAttacking = true;
      isPlayerTurn = true;
      isBotThinking = false;
      document.getElementById('status').innerText = `Переведено ${card.rank}${card.suit}! Теперь отбивается бот.`;
      render();
      triggerBotDefense();
    }

    function executeDefense(handIdx, targetIdx) {
      const card = playerHand.splice(handIdx, 1)[0];
      table[targetIdx].defend = card;
      render();

      if (table.every(p => p.defend)) {
        document.getElementById('status').innerText = "Всё отбито! Нажми «Бито» или жди ход бота.";
        setTimeout(botTossStep, 800);
      } else {
        document.getElementById('status').innerText = `Карта отбита! Осталось отбить: ${table.filter(p => !p.defend).length}`;
      }
    }

    function botTossStep() {
      if (table.length >= 6 || botHand.length === 0 || playerHand.length === 0) return;

      const tossIdx = botHand.findIndex(c => canTossCard(c) && c.suit !== trumpSuit);
      if (tossIdx !== -1) {
        const card = botHand.splice(tossIdx, 1)[0];
        table.push({ attack: card, defend: null });
        document.getElementById('status').innerText = `Бот подкинул: ${card.rank}${card.suit}! Отбивайся.`;
        render();
      }
    }

    let botTimer = null;
    function triggerBotDefense() {
      isBotThinking = true;
      document.getElementById('status').innerText = "Бот думает...";
      render();

      clearTimeout(botTimer);
      botTimer = setTimeout(botProcessDefenseStep, 600);
    }

    function botProcessDefenseStep() {
      const allUncovered = table.length > 0 && table.every(p => !p.defend);
      if (gameMode === 'perevodnoy' && allUncovered && playerHand.length >= table.length + 1 && table.length < 6) {
        const transferIdx = botHand.findIndex(c => c.rank === table[0].attack.rank);
        if (transferIdx !== -1) {
          const card = botHand.splice(transferIdx, 1)[0];
          table.push({ attack: card, defend: null });
          isPlayerAttacking = false;
          isPlayerTurn = false;
          isBotThinking = false;
          document.getElementById('status').innerText = `Бот перевел: ${card.rank}${card.suit}! Ты отбиваешься.`;
          render();
          return;
        }
      }

      const undefended = table.find(p => !p.defend);
      if (!undefended) {
        isBotThinking = false;
        document.getElementById('status').innerText = "Бот всё отбил! Можешь подкинуть еще или нажать «Бито».";
        render();
        return;
      }

      let bestIdx = -1;
      for (let i = 0; i < botHand.length; i++) {
        if (canBeat(undefended.attack, botHand[i])) {
          if (bestIdx === -1) {
            bestIdx = i;
          } else {
            const isCurTrump = botHand[i].suit === trumpSuit;
            const isBestTrump = botHand[bestIdx].suit === trumpSuit;
            if (!isCurTrump && isBestTrump) bestIdx = i;
            else if (isCurTrump === isBestTrump && VALUES[botHand[i].rank] < VALUES[botHand[bestIdx].rank]) bestIdx = i;
          }
        }
      }

      if (bestIdx !== -1) {
        undefended.defend = botHand.splice(bestIdx, 1)[0];
        render();
        if (table.some(p => !p.defend)) {
          setTimeout(botProcessDefenseStep, 450);
        } else {
          isBotThinking = false;
          document.getElementById('status').innerText = "Бот всё отбил! Можешь подкинуть еще или нажать «Бито».";
          render();
        }
      } else {
        document.getElementById('status').innerText = "Бот не может отбиться и берет карты со стола.";
        setTimeout(() => {
          table.forEach(p => { 
            botHand.push(p.attack); 
            if (p.defend) botHand.push(p.defend); 
          });
          table = [];
          refillHand(playerHand);
          sortHand(botHand);
          isBotThinking = false;
          isPlayerAttacking = true;
          isPlayerTurn = true;
          if (checkGameOver()) return;
          document.getElementById('status').innerText = "Бот забрал. Твой ход!";
          render();
        }, 1100);
      }
    }

    function handleAction() {
      if (isBotThinking) return;
      const hasUncovered = table.some(p => !p.defend);

      if (isPlayerAttacking || (!isPlayerAttacking && !hasUncovered && table.length > 0)) {
        table = [];
        refillHand(isPlayerAttacking ? playerHand : botHand);
        refillHand(isPlayerAttacking ? botHand : playerHand);
        if (checkGameOver()) return;

        if (!isPlayerAttacking) {
          isPlayerAttacking = true;
          isPlayerTurn = true;
          document.getElementById('status').innerText = "Бито! Твой ход.";
          render();
        } else {
          isPlayerAttacking = false;
          isPlayerTurn = false;
          document.getElementById('status').innerText = "Бито! Ход бота.";
          render();
          setTimeout(botAttack, 800);
        }
      } else {
        table.forEach(p => { 
          playerHand.push(p.attack); 
          if (p.defend) playerHand.push(p.defend); 
        });
        table = [];
        refillHand(botHand);
        sortHand(playerHand);
        if (checkGameOver()) return;

        isPlayerAttacking = false;
        isPlayerTurn = false;
        isBotThinking = false;
        document.getElementById('status').innerText = "Ты взял карты. Ход бота.";
        render();
        setTimeout(botAttack, 800);
      }
    }

    function botAttack() {
      if (checkGameOver()) return;
      if (botHand.length === 0) return;

      botHand.sort((a, b) => {
        const isATrump = a.suit === trumpSuit;
        const isBTrump = b.suit === trumpSuit;
        if (isATrump && !isBTrump) return 1;
        if (!isATrump && isBTrump) return -1;
        return VALUES[a.rank] - VALUES[b.rank];
      });

      const card = botHand.shift();
      table.push({ attack: card, defend: null });
      isPlayerAttacking = false;
      isPlayerTurn = false;
      isBotThinking = false;
      document.getElementById('status').innerText = `Бот ходит: ${card.rank}${card.suit}. Защищайся!`;
      render();
    }

    function refillHand(hand) {
      while (hand.length < 6 && deck.length > 0) {
        hand.push(deck.pop());
      }
      if (hand === playerHand) sortHand(playerHand);
    }

    function checkGameOver() {
      if (deck.length === 0) {
        if (playerHand.length === 0 && botHand.length === 0) {
          alert("Ничья! Игра окончена.");
          location.reload();
          return true;
        } else if (playerHand.length === 0) {
          alert("🎉 Победа! Ты вышел из игры, бот остался в дураках!");
          location.reload();
          return true;
        } else if (botHand.length === 0) {
          alert("💀 Бот вышел! Ты остался в дураках.");
          location.reload();
          return true;
        }
      }
      return false;
    }
  </script>
</body>
</html>
